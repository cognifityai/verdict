[project]
name = "verdict"
version = "0.0.1"
description = "Verdict — open-source LLM observability & drift detection SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Cognifity AI"}]

dependencies = [
    "wrapt>=1.16",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.30"]
google = ["google-genai>=1.0"]
postgres = ["psycopg[binary,pool]>=3.1"]
# NOTE: Redaction is built-in (regex + Luhn, see redaction.py) and needs no
# extra dependencies. Presidio-based redaction is a planned option, not yet
# wired, so no `redaction` extra is published.
all = ["verdict[anthropic,openai,google,postgres]"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict"]
