[project]
name = "cognifity-verdict"
version = "0.1.0a13"
description = "Verdict — open-source LLM observability & drift detection SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Cognifity AI"}]
keywords = ["llm", "observability", "drift-detection", "evaluation", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "wrapt>=1.16",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.56.2"]
google = ["google-genai>=1.0"]
postgres = ["psycopg[binary,pool]>=3.1"]
dashboard = [
    "cognifity-verdict-eval>=0.1.0a13,<0.2",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
]
local = [
    "cognifity-verdict-eval>=0.1.0a13,<0.2",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
]
telemetry = [
    "opentelemetry-proto>=1.30,<2",
    "protobuf>=5,<7",
]

# NOTE: Redaction is built in (pattern scanners + Luhn; see redaction.py) and
# needs no extra dependencies. Presidio-based redaction is a planned option,
# not yet wired, so no `redaction` extra is published.
all = ["cognifity-verdict[anthropic,openai,google,postgres,telemetry]"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv.sources]
cognifity-verdict-eval = { workspace = true }

[project.scripts]
verdict-dashboard = "verdict.dashboard.app:main"
verdict-import = "verdict.telemetry.cli:main"
verdict-agent-capture = "verdict.telemetry.local_cli:main"

[project.urls]
Homepage = "https://cognifity.ai/verdict"
Documentation = "https://github.com/cognifityai/verdict/tree/main/docs"
Repository = "https://github.com/cognifityai/verdict"
Issues = "https://github.com/cognifityai/verdict/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict"]
