[project]
name = "cognifity-verdict-inspect"
version = "0.1.0a10"
description = "Verdict Inspect — analyze chat exports for drift, hedging, refusals, and quality. Drop in a conversations.json from ChatGPT/Claude/Cursor, get a report."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Cognifity AI"}]
keywords = ["llm", "chat-export", "drift-detection", "evaluation", "reporting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "cognifity-verdict-eval>=0.1.0a10,<0.2",
    "click>=8.1",
]

[tool.uv.sources]
cognifity-verdict-eval = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
verdict-inspect = "verdict_inspect.cli:main"

[project.urls]
Homepage = "https://cognifity.ai/verdict"
Documentation = "https://github.com/cognifityai/verdict/tree/main/docs"
Repository = "https://github.com/cognifityai/verdict"
Issues = "https://github.com/cognifityai/verdict/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict_inspect"]
