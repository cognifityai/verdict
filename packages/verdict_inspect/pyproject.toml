[project]
name = "verdict-inspect"
version = "0.0.1"
description = "Verdict Inspect — analyze chat exports for drift, hedging, refusals, and quality. Drop in a conversations.json from ChatGPT/Claude/Cursor, get a report."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Cognifity AI"}]

dependencies = [
    "verdict-eval",
    "click>=8.1",
]

[tool.uv.sources]
verdict-eval = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
verdict-inspect = "verdict_inspect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict_inspect"]
