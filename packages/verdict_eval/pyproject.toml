[project]
name = "cognifity-verdict-eval"
version = "0.1.0a9"
description = "Verdict eval engine: judge, drift detection, Bradley-Terry comparator, regression injector"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Cognifity AI"}]
keywords = ["llm", "evaluation", "drift-detection", "statistics", "llm-as-judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "cognifity-verdict>=0.1.0a9,<0.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "numpy>=1.26",
]

[tool.uv.sources]
cognifity-verdict = { workspace = true }

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",
]
dev = [
    "pyyaml>=6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
verdict-pipeline = "verdict_eval.cli.pipeline:main"
verdict-probes = "verdict_eval.cli.probes:main"
verdict-cluster = "verdict_eval.cli.cluster:main"

[project.urls]
Homepage = "https://cognifity.ai/verdict"
Documentation = "https://github.com/cognifityai/verdict/tree/main/docs"
Repository = "https://github.com/cognifityai/verdict"
Issues = "https://github.com/cognifityai/verdict/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict_eval"]
