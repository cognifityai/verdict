[project]
name = "verdict-eval"
version = "0.0.1"
description = "Verdict eval engine: judge, drift detection, Bradley-Terry comparator, regression injector"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Cognifity AI"}]

dependencies = [
    "verdict",
    "pydantic>=2.7",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "numpy>=1.26",
]

[tool.uv.sources]
verdict = { workspace = true }

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict_eval"]
