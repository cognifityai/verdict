name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: run the tested release workflow
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: build distributions
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify the release source and version
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          projects = (
              pathlib.Path("packages/verdict/pyproject.toml"),
              pathlib.Path("packages/verdict_eval/pyproject.toml"),
              pathlib.Path("packages/verdict_inspect/pyproject.toml"),
          )
          versions = {
              path.as_posix(): tomllib.loads(path.read_text())["project"]["version"]
              for path in projects
          }
          if set(versions.values()) != {expected}:
              raise SystemExit(
                  f"release tag {expected!r} does not match package versions: {versions}"
              )
          PY

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check uv twine

      - name: Build distributions
        run: |
          uv build packages/verdict \
            --out-dir dist/core \
            --no-create-gitignore
          uv build packages/verdict_eval \
            --out-dir dist/eval \
            --no-create-gitignore
          uv build packages/verdict_inspect \
            --out-dir dist/inspect \
            --no-create-gitignore

      - name: Check distribution metadata
        run: python -m twine check dist/core/* dist/eval/* dist/inspect/*

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-core:
    name: publish cognifity-verdict
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-core
      url: https://pypi.org/project/cognifity-verdict/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing via OIDC; no long-lived token.

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/core/
          print-hash: true

  publish-eval:
    name: publish cognifity-verdict-eval
    needs: publish-core
    runs-on: ubuntu-latest
    environment:
      name: pypi-eval
      url: https://pypi.org/project/cognifity-verdict-eval/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing via OIDC; no long-lived token.

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/eval/
          print-hash: true

  publish-inspect:
    name: publish cognifity-verdict-inspect
    needs: publish-eval
    runs-on: ubuntu-latest
    environment:
      name: pypi-inspect
      url: https://pypi.org/project/cognifity-verdict-inspect/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing via OIDC; no long-lived token.

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/inspect/
          print-hash: true
