name: tests

on:
  push:
    branches: [public-v0, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system \
            wrapt pydantic aiosqlite httpx \
            numpy scipy scikit-learn \
            "pytest>=8" "pytest-asyncio>=0.23"
          uv pip install --system -e packages/verdict
          uv pip install --system -e packages/verdict_eval
          uv pip install --system -e packages/verdict_inspect

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: pytest
        run: pytest -v --tb=short
