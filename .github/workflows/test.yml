name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-build:
    name: UI build and generated assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 11.16.0
          runtime: node@22
          cache: true
          cache-dependency-path: ui/pnpm-lock.yaml
          install: false

      - name: Build dashboard assets
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui test
          pnpm --dir ui build

      - name: Verify generated dashboard assets are current
        run: git diff --exit-code -- ui/landing.html ui/dashboard.html ui/assets

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system \
            wrapt httpx \
            numpy scipy scikit-learn \
            "pytest>=8" "pytest-asyncio>=0.23" "ruff>=0.5" \
            -r ui/requirements.txt
          uv pip install --system -e "packages/verdict[anthropic,openai,google,telemetry]"
          uv pip install --system -e packages/verdict_eval
          uv pip install --system -e packages/verdict_inspect

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Ruff
        run: ruff check packages scripts ui

      - name: pytest
        run: python -m pytest -v --tb=short

  anthropic-compat:
    name: Anthropic declared minimum SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the declared minimum Anthropic SDK
        run: |
          python -m pip install --disable-pip-version-check \
            pytest pytest-asyncio "anthropic==0.30.0"
          python -m pip install --disable-pip-version-check \
            -e packages/verdict

      - name: Exercise both resource layouts and stream lifecycles
        run: >-
          python -m pytest -v --tb=short
          packages/verdict/tests/test_provider_scalar_persistence.py
          packages/verdict/tests/test_instrumentor_wrap_guard.py
          -k 'messages_stream_helper or raw_stream_surface or complete_supported_surface'

  openai-compat:
    name: OpenAI declared minimum SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the declared minimum OpenAI SDK
        run: |
          python -m pip install --disable-pip-version-check \
            pytest pytest-asyncio "openai==1.56.2"
          python -m pip install --disable-pip-version-check \
            -e "packages/verdict[openai]"

      - name: Exercise Chat capture without the optional Responses resource
        run: >-
          python -m pytest -v --tb=short
          packages/verdict/tests/test_provider_scalar_persistence.py
          packages/verdict/tests/test_instrumentor_wrap_guard.py
          -k 'openai_chat_create_stream or openai_minimum_default_client_constructor or complete_supported_surface'

  postgres:
    name: PostgreSQL adapter round trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verdict
          POSTGRES_PASSWORD: verdict-test
          POSTGRES_DB: verdict_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verdict -d verdict_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERDICT_TEST_POSTGRES_DSN: postgresql://verdict:verdict-test@127.0.0.1:5432/verdict_test
      VERDICT_REQUIRE_POSTGRES_TESTS: "1"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Postgres test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest "psycopg[binary,pool]"
          python -m pip install --disable-pip-version-check \
            -e "packages/verdict[dashboard,postgres]" \
            -e packages/verdict_eval

      - name: Exercise the real Postgres adapter
        run: >-
          python -m pytest -v
          packages/verdict/tests/test_postgres_integration.py
          packages/verdict/tests/test_telemetry_postgres.py
          ui/tests/test_postgres_dashboard.py

  release-artifacts:
    name: Build and cold-install release artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install release tools
        run: python -m pip install --disable-pip-version-check uv twine

      - name: Build distributions
        run: |
          uv build packages/verdict --out-dir dist/core --no-create-gitignore
          uv build packages/verdict_eval --out-dir dist/eval --no-create-gitignore
          uv build packages/verdict_inspect --out-dir dist/inspect --no-create-gitignore

      - name: Check distribution metadata
        run: python -m twine check dist/core/* dist/eval/* dist/inspect/*

      - name: Verify the default container version matches the release artifacts
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(
              pathlib.Path("packages/verdict/pyproject.toml").read_text()
          )["project"]["version"]
          dockerfile = pathlib.Path("Dockerfile").read_text()
          match = re.search(r"^ARG VERDICT_VERSION=(\S+)$", dockerfile, re.MULTILINE)
          if match is None or match.group(1) != version:
              raise SystemExit(
                  f"Dockerfile default {match.group(1) if match else None!r} "
                  f"does not match release version {version!r}"
              )
          PY

      - name: Reject private or review files in distributions
        run: python scripts/check_release_artifacts.py dist

      - name: Cold-install wheels
        run: |
          python -m venv /tmp/verdict-wheel-venv
          /tmp/verdict-wheel-venv/bin/python -m pip install --disable-pip-version-check dist/core/*.whl
          /tmp/verdict-wheel-venv/bin/python -m pip install --disable-pip-version-check dist/eval/*.whl
          /tmp/verdict-wheel-venv/bin/python -m pip install --disable-pip-version-check dist/inspect/*.whl
          /tmp/verdict-wheel-venv/bin/python -m pip install --disable-pip-version-check \
            "dist/core/cognifity_verdict-0.1.0a13-py3-none-any.whl[dashboard,local,postgres,telemetry]"
          /tmp/verdict-wheel-venv/bin/python -m pip check
          cd /tmp
          /tmp/verdict-wheel-venv/bin/python -c \
            "import verdict, verdict_eval, verdict_inspect; assert {verdict.__version__, verdict_eval.__version__, verdict_inspect.__version__} == {'0.1.0a13'}"
          /tmp/verdict-wheel-venv/bin/python -c \
            "from importlib import metadata, util; import verdict_eval; removed=set('ProbeRunner ProbeSuite Probe ProbeExpectation ProbeResult ProbeRun default_suite load_suite_yaml'.split()); assert util.find_spec('verdict_eval.probes') is None; assert removed.isdisjoint(verdict_eval.__all__); assert all(not hasattr(verdict_eval, name) for name in removed); assert not any(req.lower().startswith('pyyaml') for req in metadata.requires('cognifity-verdict-eval') or ())"
          /tmp/verdict-wheel-venv/bin/verdict-inspect --help
          /tmp/verdict-wheel-venv/bin/verdict-pipeline --help
          test ! -e /tmp/verdict-wheel-venv/bin/verdict-probes
          /tmp/verdict-wheel-venv/bin/verdict-cluster --help
          /tmp/verdict-wheel-venv/bin/verdict-dashboard --help
          /tmp/verdict-wheel-venv/bin/verdict-import --help
          /tmp/verdict-wheel-venv/bin/verdict-agent-capture --help
          /tmp/verdict-wheel-venv/bin/verdict-monitor --help
          /tmp/verdict-wheel-venv/bin/verdict-local --help
          /tmp/verdict-wheel-venv/bin/python -c \
            "from importlib.resources import files; root = files('verdict.dashboard').joinpath('static'); assert root.joinpath('dashboard.html').is_file(); assert root.joinpath('assets/dashboard.js').is_file()"

      - name: Exercise installed telemetry through pipeline and dashboard
        run: |
          /tmp/verdict-wheel-venv/bin/python scripts/generate_telemetry_samples.py \
            --output /tmp/verdict-release-telemetry \
            --as-of 2026-08-26T12:00:00Z \
            --per-source-window 5
          for import_pass in initial retry; do
            for source_name in otlp langfuse langsmith datadog phoenix opik mlflow voice; do
              /tmp/verdict-wheel-venv/bin/verdict-import file \
                "/tmp/verdict-release-telemetry/$source_name.jsonl" \
                --format "$source_name" \
                --source-scope "release-$source_name" \
                --tenant-id release-e2e \
                --storage sqlite:////tmp/verdict-a13-telemetry.db
            done
          done
          /tmp/verdict-wheel-venv/bin/verdict-pipeline \
            --storage sqlite:////tmp/verdict-a13-telemetry.db \
            --judge-provider fake \
            --judge-model fake-judge \
            --embedder deterministic \
            --clustering-version telemetry-release-a13 \
            --cluster-threshold 0.1 \
            --as-of 2026-08-26T12:00:00Z \
            --sampling stratified \
            --target-per-cluster 40 \
            --min-sample-size 30 \
            --limit 1000
          /tmp/verdict-wheel-venv/bin/verdict-dashboard \
            --storage sqlite:////tmp/verdict-a13-telemetry.db \
            --host 127.0.0.1 \
            --port 18773 \
            >/tmp/verdict-a13-dashboard.log 2>&1 &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid" 2>/dev/null || true; cat /tmp/verdict-a13-dashboard.log' EXIT
          cd /tmp
          DASHBOARD_URL=http://127.0.0.1:18773 \
          /tmp/verdict-wheel-venv/bin/python - <<'PY'
          import json
          import os
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          from verdict.storage.sqlite import SQLiteStorage

          database = "/tmp/verdict-a13-telemetry.db"
          storage = SQLiteStorage(database)
          traces = storage.list_traces(tenant_id="release-e2e", limit=1000)
          assert len(traces) == 80
          assert {trace.tags["verdict.source"] for trace in traces} == {
              "otlp", "langfuse", "langsmith", "datadog",
              "phoenix", "opik", "mlflow", "voice",
          }
          assert all(trace.cluster_id for trace in traces)
          assert all(trace.input_tokens is not None for trace in traces)
          assert all(trace.output_tokens is not None for trace in traces)
          assert all(trace.latency_ms is not None for trace in traces)
          storage.close()

          base_url = os.environ["DASHBOARD_URL"]
          for _ in range(100):
              try:
                  with urlopen(f"{base_url}/api/health", timeout=1) as response:
                      assert response.status == 200
                  break
              except URLError:
                  time.sleep(0.05)
          else:
              raise AssertionError("installed dashboard did not become healthy")

          pages = []
          for offset in (0, 30, 60):
              with urlopen(f"{base_url}/api/data?trace_offset={offset}", timeout=10) as response:
                  assert response.status == 200
                  pages.append(json.load(response))
          assert [len(page["samples"]) for page in pages] == [30, 30, 20]
          assert pages[0]["meta"]["totalTraces"] == 80
          assert pages[0]["meta"]["totalJudged"] == 80
          assert pages[0]["driftRun"]["signalCount"] == 0
          with urlopen(f"{base_url}/dashboard", timeout=10) as response:
              assert response.status == 200
              assert b"<!doctype html>" in response.read(256)
          PY
          kill "$dashboard_pid" 2>/dev/null || true
          wait "$dashboard_pid" || true
          trap - EXIT

      - name: Cold-install source distributions
        run: |
          python -m venv /tmp/verdict-sdist-venv
          /tmp/verdict-sdist-venv/bin/python -m pip install --disable-pip-version-check dist/core/*.tar.gz
          /tmp/verdict-sdist-venv/bin/python -m pip install --disable-pip-version-check dist/eval/*.tar.gz
          /tmp/verdict-sdist-venv/bin/python -m pip install --disable-pip-version-check dist/inspect/*.tar.gz
          /tmp/verdict-sdist-venv/bin/python -m pip install --disable-pip-version-check \
            "dist/core/cognifity_verdict-0.1.0a13.tar.gz[dashboard,local,postgres,telemetry]"
          /tmp/verdict-sdist-venv/bin/python -m pip check
          cd /tmp
          /tmp/verdict-sdist-venv/bin/python -c \
            "import verdict, verdict_eval, verdict_inspect; assert {verdict.__version__, verdict_eval.__version__, verdict_inspect.__version__} == {'0.1.0a13'}"
          /tmp/verdict-sdist-venv/bin/python -c \
            "from importlib import metadata, util; import verdict_eval; removed=set('ProbeRunner ProbeSuite Probe ProbeExpectation ProbeResult ProbeRun default_suite load_suite_yaml'.split()); assert util.find_spec('verdict_eval.probes') is None; assert removed.isdisjoint(verdict_eval.__all__); assert all(not hasattr(verdict_eval, name) for name in removed); assert not any(req.lower().startswith('pyyaml') for req in metadata.requires('cognifity-verdict-eval') or ())"
          /tmp/verdict-sdist-venv/bin/verdict-inspect --help
          /tmp/verdict-sdist-venv/bin/verdict-pipeline --help
          test ! -e /tmp/verdict-sdist-venv/bin/verdict-probes
          /tmp/verdict-sdist-venv/bin/verdict-cluster --help
          /tmp/verdict-sdist-venv/bin/verdict-dashboard --help
          /tmp/verdict-sdist-venv/bin/verdict-import --help
          /tmp/verdict-sdist-venv/bin/verdict-agent-capture --help
          /tmp/verdict-sdist-venv/bin/verdict-monitor --help
          /tmp/verdict-sdist-venv/bin/verdict-local --help
          /tmp/verdict-sdist-venv/bin/python -c \
            "from importlib.resources import files; root = files('verdict.dashboard').joinpath('static'); assert root.joinpath('dashboard.html').is_file(); assert root.joinpath('assets/dashboard.js').is_file()"

      - name: Upgrade a published 0.1.0a12 SQLite store in place
        run: |
          python -m venv /tmp/verdict-upgrade-venv
          /tmp/verdict-upgrade-venv/bin/python -m pip install --disable-pip-version-check \
            "cognifity-verdict==0.1.0a12" \
            "cognifity-verdict-eval==0.1.0a12" \
            "cognifity-verdict-inspect==0.1.0a12"
          test -e /tmp/verdict-upgrade-venv/bin/verdict-probes
          /tmp/verdict-upgrade-venv/bin/python -c \
            "from importlib import util; assert util.find_spec('verdict_eval.probes') is not None"
          /tmp/verdict-upgrade-venv/bin/python - <<'PY'
          from datetime import datetime, timezone
          from verdict.schema import Trace
          from verdict.storage.sqlite import SQLiteStorage

          instant = datetime.now(timezone.utc)
          storage = SQLiteStorage("/tmp/verdict-a12-upgrade.db")
          storage.insert_trace(
              Trace(
                  trace_id="published-a12-trace",
                  started_at=instant,
                  ended_at=instant,
                  tenant_id=None,
                  tags={"verdict.intent_key": "billing.v1"},
              )
          )
          storage.close()
          PY
          /tmp/verdict-upgrade-venv/bin/python -m pip install --disable-pip-version-check --upgrade \
            dist/core/*.whl dist/eval/*.whl dist/inspect/*.whl
          /tmp/verdict-upgrade-venv/bin/python -m pip check
          test ! -e /tmp/verdict-upgrade-venv/bin/verdict-probes
          /tmp/verdict-upgrade-venv/bin/verdict-cluster \
            --storage sqlite:////tmp/verdict-a12-upgrade.db \
            --tenant __verdict_local__ --actor release normalize --limit 100
          /tmp/verdict-upgrade-venv/bin/python - <<'PY'
          from importlib import metadata, util

          import verdict
          import verdict_eval
          import verdict_inspect
          from verdict.storage.sqlite import SQLiteStorage

          assert {
              verdict.__version__,
              verdict_eval.__version__,
              verdict_inspect.__version__,
          } == {"0.1.0a13"}
          removed = set(
              "ProbeRunner ProbeSuite Probe ProbeExpectation ProbeResult "
              "ProbeRun default_suite load_suite_yaml".split()
          )
          assert util.find_spec("verdict_eval.probes") is None
          assert removed.isdisjoint(verdict_eval.__all__)
          assert all(not hasattr(verdict_eval, name) for name in removed)
          assert not any(
              requirement.lower().startswith("pyyaml")
              for requirement in metadata.requires("cognifity-verdict-eval") or ()
          )
          storage = SQLiteStorage("/tmp/verdict-a12-upgrade.db")
          trace = storage.get_trace("published-a12-trace")
          assert trace is not None
          assert trace.tags["verdict.intent_key"] == "billing.v1"
          assert trace.analysis_started_at_state == "valid"
          assert storage.count_pending_analysis_rows("__verdict_local__") == 0
          storage.close()
          PY
