name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@22
          cache: true
          cache-dependency-path: ui/pnpm-lock.yaml
          install: false

      - name: Build dashboard assets
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      - name: Verify generated dashboard assets are current
        run: git diff --exit-code -- ui/landing.html ui/dashboard.html ui/assets

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system \
            wrapt pydantic aiosqlite httpx \
            numpy scipy scikit-learn \
            "pytest>=8" "pytest-asyncio>=0.23"
          uv pip install --system -e packages/verdict
          uv pip install --system -e packages/verdict_eval
          uv pip install --system -e packages/verdict_inspect

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: pytest
        run: python -m pytest -v --tb=short
