<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1020" style="width:100%;max-width:720px;height:auto" role="img" aria-labelledby="title description">
  <title id="title">Verdict evidence flow in the current source checkout</title>
  <desc id="description">Agent and model-call capture, local histories, and telemetry imports enter direct storage or file delivery. Durable evidence feeds deterministic analysis, optional approved AI, reviewed model-call monitoring, and the dashboard.</desc>
  <defs>
    <style>
      .heading { font: 700 27px system-ui, sans-serif; fill: #edf4f1; }
      .subhead { font: 14px system-ui, sans-serif; fill: #9aaba4; }
      .label { font: 700 20px system-ui, sans-serif; fill: #edf4f1; }
      .detail { font: 15px system-ui, sans-serif; fill: #c3d1cb; }
      .foot { font: 14px system-ui, sans-serif; fill: #9aaba4; }
      .card { fill: #151d1a; stroke: #355247; stroke-width: 2; }
      .arrow { stroke: #4ee1aa; stroke-width: 3; stroke-linecap: round; }
    </style>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4ee1aa"/>
    </marker>
  </defs>
  <rect width="390" height="1020" fill="#0b0e0d"/>
  <text x="20" y="44" class="heading">Verdict evidence flow</text>
  <text x="20" y="69" class="subhead">Current source · customer-managed, single tenant</text>

  <rect x="20" y="91" width="350" height="119" rx="12" class="card"/>
  <text x="39" y="124" class="label">Capture and import</text>
  <text x="39" y="154" class="detail">Application agents + provider calls</text>
  <text x="39" y="181" class="detail">Claude/Codex history + telemetry</text>
  <line x1="195" y1="212" x2="195" y2="233" class="arrow" marker-end="url(#tip)"/>

  <rect x="20" y="240" width="350" height="145" rx="12" class="card"/>
  <text x="39" y="273" class="label">Deliver</text>
  <text x="39" y="303" class="detail">Direct to SQLite or PostgreSQL</text>
  <text x="39" y="330" class="detail">SDK file spool → shipper → collector</text>
  <text x="39" y="357" class="detail">Collector writes to PostgreSQL</text>
  <line x1="195" y1="387" x2="195" y2="408" class="arrow" marker-end="url(#tip)"/>

  <rect x="20" y="415" width="350" height="119" rx="12" class="card"/>
  <text x="39" y="448" class="label">Keep evidence</text>
  <text x="39" y="478" class="detail">Runs · turns · events · traces/spans</text>
  <text x="39" y="505" class="detail">Usage, outcomes + coverage</text>
  <line x1="195" y1="536" x2="195" y2="557" class="arrow" marker-end="url(#tip)"/>

  <rect x="20" y="564" width="350" height="145" rx="12" class="card"/>
  <text x="39" y="597" class="label">Analyze selected evidence</text>
  <text x="39" y="627" class="detail">Deterministic issues + usage</text>
  <text x="39" y="654" class="detail">Optional AI after evidence preview</text>
  <text x="39" y="681" class="detail">and explicit approval</text>
  <line x1="195" y1="711" x2="195" y2="732" class="arrow" marker-end="url(#tip)"/>

  <rect x="20" y="739" width="350" height="119" rx="12" class="card"/>
  <text x="39" y="772" class="label">Monitor reviewed checks</text>
  <text x="39" y="802" class="detail">Scheduled checks + worker status</text>
  <text x="39" y="829" class="detail">Reviewed model-call comparisons</text>
  <line x1="195" y1="860" x2="195" y2="881" class="arrow" marker-end="url(#tip)"/>

  <rect x="20" y="888" width="350" height="91" rx="12" class="card"/>
  <text x="39" y="921" class="label">Investigate in the dashboard</text>
  <text x="39" y="951" class="detail">Home → evidence → groups → setup</text>
  <text x="20" y="1008" class="foot">Saved setup alone is not a running monitor.</text>
</svg>
