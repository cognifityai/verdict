  <text x="200" y="605" class="node-title" text-anchor="middle" fill="#F5F7FA">AnthropicAdapter</text>
  <text x="200" y="622" class="node-sub" text-anchor="middle" fill="#00C2FF">claude-haiku-4-5, sonnet, opus</text>

