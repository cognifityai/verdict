# Optional local Postgres stack. Verdict uses SQLite by default; run this when
# developing or testing the Postgres storage adapter. The credentials below are
# intentionally local-only and must not be reused in a shared environment.

services:
  postgres:
    image: postgres:16-alpine
    container_name: verdict-postgres
    environment:
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: verdict
      POSTGRES_DB: verdict
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - verdict_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict -d verdict"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verdict_pg_data:
